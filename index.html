<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">

<head>
    <meta name="description" content="Página inicial da Mercearia da Proz">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/img/store.png" type="image/x-icon">
    <title>Mercado Proz - Catálogo</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>
    <header>
        <nav class="navbar md:navbar-expand bg-1 rounded-5 shadow-sm">
            <div class="container-fluid">

                <a class="navbar-brand" href="#">
                    <img src="assets/img/store.png" width="50" height="50" alt="Logo da Mercearia Proz">
                </a>

                <div class="d-flex align-items-center gap-3 ms-auto">

                    <a class="nav-link fw-bold" href="index.html">
                        Catálogo
                    </a>
                    <a class="nav-link" href="#" onclick="verificarAcesso(event)">
                        Administrador
                    </a>

                </div>

            </div>
        </nav>
    </header>


    <main>
        <section class="ms-7 mt-4">

            <label for="pesquisa" class="form-label fw-bold">Encontre seus produtos:</label>
            <input class="form-control" style="max-width: 300px;" type="search" id="pesquisa"
                placeholder="Pesquisar produtos..." aria-label="Pesquisar produtos">
        </section>


        <section class="catalogo" id="lista-Produtos">

            <h2>Nosso catálogo</h2>

            <div class="produtos" id="lista-produtos">


        </section>
    </main>


    <script src="assets/js/teste.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <script src="assets/js/pesquisa.js"></script>
</body>

</html>
